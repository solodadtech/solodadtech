# Applies dns/dnsconfig.js to Cloudflare whenever it changes on main.
# Requires the Cloudflare API token repo secret (see DNS.md for one-time setup).
name: Sync DNS

on:
  push:
    branches: [main]
    paths: ["dns/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Strip any accidental whitespace/newlines from the pasted secret —
      # a stray newline makes an invalid Authorization header.
      # NOTE: secret name has a typo (CLOUDEDLARE); mapped here so it Just Works.
      - name: Prepare token
        run: |
          # keep only characters legal in a Cloudflare token (drops whitespace,
          # smart quotes, zero-width unicode, and other paste artifacts)
          CLEANED=$(printf '%s' "${{ secrets.CLOUDEDLARE_API_TOKEN }}" | tr -cd 'A-Za-z0-9_-')
          echo "::add-mask::$CLEANED"
          echo "Token length after cleanup: ${#CLEANED} (Cloudflare API tokens are typically 40)"
          echo "CLOUDFLARE_API_TOKEN=$CLEANED" >> "$GITHUB_ENV"

      - name: Verify token with Cloudflare
        run: |
          status=$(curl -s -o /tmp/verify.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Cloudflare token verify HTTP status: $status"
          head -c 500 /tmp/verify.json; echo
          test "$status" = "200"

      - name: Validate config
        run: >
          docker run --rm -v "$PWD/dns:/dns" -w /dns
          stackexchange/dnscontrol check

      - name: Preview changes
        run: >
          docker run --rm -v "$PWD/dns:/dns" -w /dns
          -e CLOUDFLARE_API_TOKEN
          stackexchange/dnscontrol preview

      - name: Apply changes
        run: >
          docker run --rm -v "$PWD/dns:/dns" -w /dns
          -e CLOUDFLARE_API_TOKEN
          stackexchange/dnscontrol push
