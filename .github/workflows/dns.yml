# Applies dns/dnsconfig.js to Cloudflare whenever it changes on main.
# Requires the CLOUDFLARE_API_TOKEN repo secret (see DNS.md for one-time setup).
name: Sync DNS

on:
  push:
    branches: [main]
    paths: ["dns/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate config
        run: >
          docker run --rm -v "$PWD/dns:/dns" -w /dns
          stackexchange/dnscontrol check

      - name: Preview changes
        env:
          # secret was saved under a typo'd name; mapped here so it Just Works
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDEDLARE_API_TOKEN }}
        run: >
          docker run --rm -v "$PWD/dns:/dns" -w /dns
          -e CLOUDFLARE_API_TOKEN
          stackexchange/dnscontrol preview

      - name: Apply changes
        env:
          # secret was saved under a typo'd name; mapped here so it Just Works
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDEDLARE_API_TOKEN }}
        run: >
          docker run --rm -v "$PWD/dns:/dns" -w /dns
          -e CLOUDFLARE_API_TOKEN
          stackexchange/dnscontrol push
